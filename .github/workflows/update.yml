name: Actualizează lista de posturi

on:
  schedule:
    - cron: "17 3 * * 1"   # în fiecare luni, 03:17 UTC
  workflow_dispatch:        # și la cerere, din pagina Actions

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.4
      - run: python -I tools/build.py
      - name: Publică lista nouă (doar dacă s-a schimbat ceva)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data/cache/cna.json data/review.txt data/review-ro.txt
          if git diff --cached --quiet; then
            echo "Nimic nou."
          else
            git commit -m "Lista actualizată $(date -u +%Y-%m-%d)"
            git push
          fi
